name: Agentic Governance

on:
  push:
  pull_request:

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate setup
        run: bash scripts/validate_setup.sh

      - name: Run evals
        run: python3 scripts/run_evals.py
