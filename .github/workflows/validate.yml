name: Agentic Governance

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Validate setup
        run: bash scripts/validate_setup.sh

  optional-brand-tools:
    name: optional brand tooling
    if: ${{ vars.RUN_BRAND_TOOLS == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements-brand.txt
      - run: python3 -m pytest -q tests/brand_designer --disable-warnings

  website-fixture:
    name: website fixture
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fixtures/website/stellar-repair
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit test dependencies
        working-directory: .
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fixtures/website/stellar-repair/package-lock.json
      - name: Verify fixture contract
        working-directory: .
        run: python3 scripts/verify_website_fixture.py
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Test browser SEO auditor
        working-directory: .
        run: python3 -m pytest -q tests/test_website_browser_audit.py tests/test_seo_audit_diff.py
      - run: npm run test:e2e

  plugin-trigger-evals:
    name: skill-trigger evals (manual, billed)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Run skill-trigger evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash scripts/run_plugin_evals.sh
