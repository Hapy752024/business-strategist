name: Agentic Governance

on:
  push:
  pull_request:

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Validate setup
        run: bash scripts/validate_setup.sh

      - name: Run evals
        run: python3 scripts/run_evals.py

      - name: Run full Python test suite
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -q tests --disable-warnings

      - name: Compare agentic process contracts
        run: python3 scripts/benchmark_agentic_process.py --output-dir /tmp/agentic-process-eval

  optional-brand-tools:
    name: optional brand tooling
    if: ${{ vars.RUN_BRAND_TOOLS == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements-brand.txt
      - run: python3 -m pytest -q tests/brand_designer --disable-warnings

  website-fixture:
    name: website fixture
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fixtures/website/stellar-repair
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fixtures/website/stellar-repair/package-lock.json
      - name: Verify fixture contract
        working-directory: .
        run: python3 scripts/verify_website_fixture.py
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
