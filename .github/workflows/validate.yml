name: Agentic Governance

on:
  push:
  pull_request:

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Validate setup
        run: bash scripts/validate_setup.sh

      - name: Run evals
        run: python3 scripts/run_evals.py

  optional-brand-tools:
    name: optional brand tooling
    if: ${{ vars.RUN_BRAND_TOOLS == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements-brand.txt
      - run: python3 -m pytest -q tests/brand_designer --disable-warnings
